name: daily-pipeline

# 평일 아침 프리마켓 브리핑 파이프라인(레이어 A).
# 수집 → 감정 → 시그널 → 리포트. 오늘 날짜로 찍히되 내용은 직전 세션 마감과
# 밤사이 뉴스다(아침엔 당일 장이 아직 열리지 않는다). 다루는 구간은 실행 시각이
# 아니라 pipeline.py 의 BRIEFING_CUTOFF_HOUR(07:00 KST)로 자른다.
#
# 정시성은 외부 스케줄러가 workflow_dispatch 를 찔러서 확보한다. GitHub 의
# schedule 은 이 레포에서 실측 중앙값 5시간 18분(최대 12.2시간) 밀려서 아침
# 리포트의 트리거로 쓸 수 없다. 아래 cron 은 외부 스케줄러가 죽었을 때를 위한
# 그물일 뿐이다 — 늦게라도 그날 리포트는 남는다.
#
# cron 은 UTC 기준: '0 22 * * 0-4' = 22:00 UTC = 다음 날 07:00 KST, 월~금 아침.
on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch: {}   # 외부 스케줄러 + 수동 실행

# 스케줄과 수동 실행이 겹쳐도 동시에 두 번 돌지 않게(멱등 안전).
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read          # 최소 권한 (레포 체크아웃만)

jobs:
  run:
    runs-on: ubuntu-latest
    # 매달린 실행이 6시간(러너 기본 한도)을 다 태우는 일이 두 번 있었다
    # (2026-09-21, 2026-09-28). 정상 실행은 8~20분이라 45분이면 넉넉하다.
    # 한도에 걸리면 cancelled 로 끝나 원인 파악도 어려우므로 먼저 잘라 낸다.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # 버퍼링을 끄지 않으면 파이썬이 출력을 모았다가 종료 시점에 한꺼번에
          # 내보낸다. 매달려서 강제 종료되면 로그가 통째로 비어 어느 단계에서
          # 멈췄는지조차 알 수 없다(2026-09-28 취소된 실행이 그랬다).
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python pipeline.py
