name: daily-pipeline

# 평일 장마감 후 자동 수집 → 감정 → 시그널 → 리포트 파이프라인(레이어 A).
# cron 은 UTC 기준: '0 7 * * 1-5' = 07:00 UTC = 16:00 KST, 월~금.
on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch: {}   # 수동 실행 허용

# 스케줄과 수동 실행이 겹쳐도 동시에 두 번 돌지 않게(멱등 안전).
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read          # 최소 권한 (레포 체크아웃만)

jobs:
  run:
    runs-on: ubuntu-latest
    # 매달린 실행이 6시간(러너 기본 한도)을 다 태우는 일이 두 번 있었다
    # (2026-09-21, 2026-09-28). 정상 실행은 8~20분이라 45분이면 넉넉하다.
    # 한도에 걸리면 cancelled 로 끝나 원인 파악도 어려우므로 먼저 잘라 낸다.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # 버퍼링을 끄지 않으면 파이썬이 출력을 모았다가 종료 시점에 한꺼번에
          # 내보낸다. 매달려서 강제 종료되면 로그가 통째로 비어 어느 단계에서
          # 멈췄는지조차 알 수 없다(2026-09-28 취소된 실행이 그랬다).
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python pipeline.py
