name: daily-pipeline

# 평일 아침 프리마켓 브리핑 파이프라인(레이어 A).
# 수집 → 감정 → 시그널 → 리포트. 오늘 날짜로 찍히되 내용은 직전 세션 마감과
# 밤사이 뉴스다(아침엔 당일 장이 아직 열리지 않는다). 다루는 구간은 실행 시각이
# 아니라 pipeline.py 의 BRIEFING_CUTOFF_HOUR(07:00 KST)로 자른다.
#
# 정시성은 외부 스케줄러가 workflow_dispatch 를 찔러서 확보한다. GitHub 의
# schedule 은 이 레포에서 실측 중앙값 5시간 18분(최대 12.2시간) 밀려서 아침
# 리포트의 트리거로 쓸 수 없다.
#
# 아래 cron 은 외부 스케줄러가 죽었을 때를 위한 그물이다.
#
# 트리거가 무엇이든 "오늘 리포트가 아직 없을 때만" 파이프라인을 돌린다(아래 guard
# 스텝). 조건 없이 돌리면 아침에 이미 만든 리포트를 같은 구간으로 다시 만들어 Gemini
# 쿼터만 더 쓴다 — 2026-10-01 에 그물 cron 이 그랬고, 2026-10-05~08 에는 외부
# 스케줄러가 07:00/07:15/07:30/07:45 로 네 번 찔러서 매일 리포트를 세 번 덮어썼다.
# 바깥 스케줄러의 설정 실수는 언제든 또 날 수 있으니 레포 쪽에서 막는다.
#
# 리포트를 일부러 다시 만들고 싶을 때는 force 입력을 켜서 가드를 건너뛴다.
#
# cron 은 UTC 기준: '0 2 * * 1-5' = 02:00 UTC = 11:00 KST.
# 지연이 0이어도 외부 스케줄러(07:00 KST)보다 뒤고, 최대 12시간 밀려도 23:00 KST 라
# 같은 한국 날짜 안에 머문다 — 그물이 엉뚱한 날짜의 리포트를 만들지 않는다.
on:
  schedule:
    - cron: '0 2 * * 1-5'
  # 외부 스케줄러 + 수동 실행. 외부 스케줄러는 입력 없이 찌르므로 force 는 false 다.
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 리포트가 이미 있어도 다시 만든다'
        type: boolean
        default: false

# 스케줄과 수동 실행이 겹쳐도 동시에 두 번 돌지 않게(멱등 안전).
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read          # 최소 권한 (레포 체크아웃만)

jobs:
  run:
    runs-on: ubuntu-latest
    # 매달린 실행이 6시간(러너 기본 한도)을 다 태우는 일이 두 번 있었다
    # (2026-09-21, 2026-09-28). 정상 실행은 8~20분이라 45분이면 넉넉하다.
    # 한도에 걸리면 cancelled 로 끝나 원인 파악도 어려우므로 먼저 잘라 낸다.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      # checkout 을 먼저 한다. 가드를 앞에 두면 잡 기본 working-directory 인
      # pipeline/ 이 아직 없어서 . 로 덮어야 하는데, 그 경로는 schedule 이벤트로만
      # 밟혀 돌려보기 전에는 확인할 수 없다. checkout 은 몇 초라 먼저 치르는 게 싸다.
      - uses: actions/checkout@v4

      # 중복 실행 가드. schedule·외부 스케줄러·수동 실행을 모두 본다. force 를 켠
      # 실행만 건너뛴다 — schedule 이벤트에는 inputs 가 없어 null != 'true' 로 참이 되고,
      # 외부 스케줄러도 입력 없이 찌르므로 가드를 탄다.
      #
      # 판정을 못 하면(API 가 자고 있거나 5xx) 건너뛰지 않고 실행한다. 중복
      # 리포트는 쿼터를 더 쓸 뿐이지만, 건너뛴 날은 브리핑 자체가 없다.
      - name: 오늘 리포트가 이미 있는지 확인
        id: guard
        if: github.event.inputs.force != 'true'
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          # Render 무료 인스턴스는 슬립에서 깨는 데 30~60초 걸린다.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
                 "https://briefing-6pzj.onrender.com/api/reports/$TODAY") || CODE="000"
          echo "$TODAY 리포트 조회 -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "이미 있다. 파이프라인을 건너뛴다(다시 만들려면 force 입력)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "없거나 판정 불가. 파이프라인을 돌린다."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          # 버퍼링을 끄지 않으면 파이썬이 출력을 모았다가 종료 시점에 한꺼번에
          # 내보낸다. 매달려서 강제 종료되면 로그가 통째로 비어 어느 단계에서
          # 멈췄는지조차 알 수 없다(2026-09-28 취소된 실행이 그랬다).
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 아침 브리핑 메일(선택). 비어 있으면 알림 단계만 건너뛴다.
          # HOLDING_SYMBOLS 는 공개 레포라 시크릿으로 둔다(종목 코드만, 콤마 구분).
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HOLDING_SYMBOLS: ${{ secrets.HOLDING_SYMBOLS }}
        run: python pipeline.py
